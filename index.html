<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA APPLE ID</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root { --primary-purple: #5b2d8c; --bg-gray: #f5f5f5; --text-dark: #1f2937; --text-light: #6b7280; --border-color: #e5e7eb; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; display: flex; justify-content: center; color: var(--text-dark); }
        .container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        .logo-container { text-align: center; margin-top: 30px; margin-bottom: 20px; }
        .logo-text { font-size: 48px; font-weight: 700; color: var(--primary-purple); margin: 0; display: flex; justify-content: center; }
        .logo-sub { font-size: 16px; font-weight: 500; color: var(--primary-purple); letter-spacing: 5px; margin-top: 5px; }
        .main-card { background-color: white; border-radius: 12px; padding: 24px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 15px; color: black; }
        .data-box { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 25px; overflow: hidden; }
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
        .data-row:last-child { border-bottom: none; }
        .data-content { display: flex; flex-direction: column; flex: 1; }
        .data-label { font-size: 13px; font-weight: 600; color: black; }
        .data-value { font-size: 16px; color: var(--text-light); word-break: break-all; }
        .copy-btn { background-color: var(--primary-purple); border: none; border-radius: 6px; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .copy-btn svg { width: 18px; height: 18px; fill: white; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: #333; color: white; padding: 10px 20px; border-radius: 30px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo-text"><i>M</i>EGA</div>
            <div class="logo-sub">APPLE ID</div>
        </div>
        <div class="main-card">
            <div class="section-title">Apple ID:</div>
            <div class="data-box">
                <div class="data-row">
                    <div class="data-content"><div class="data-label">Email:</div><div class="data-value" id="val-email">---</div></div>
                    <button class="copy-btn" onclick="copyText('val-email')"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                </div>
                <div class="data-row">
                    <div class="data-content"><div class="data-label">Password:</div><div class="data-value" id="val-password">---</div></div>
                    <button class="copy-btn" onclick="copyText('val-password')"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                </div>
                <div class="data-row">
                    <div class="data-content"><div class="data-label">Birthday:</div><div class="data-value" id="val-birthday">---</div></div>
                    <button class="copy-btn" onclick="copyText('val-birthday')"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                </div>
            </div>
            <div class="section-title">Security Question:</div>
            <div class="data-box">
                <div class="data-row">
                    <div class="data-content"><div class="data-value" style="color:black; font-weight:500;">What is the first name of your best friend in high school?</div><div class="data-value" id="val-q1" style="margin-top:5px;">---</div></div>
                    <button class="copy-btn" onclick="copyText('val-q1')"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                </div>
            </div>
        </div>
    </div>
    <div id="toast" class="toast">تم النسخ!</div>
    <script>
        window.onload = function() {
            const hash = window.location.hash.substring(1);
            if(hash) {
                const params = new URLSearchParams(hash);
                if(params.get('e')) document.getElementById('val-email').innerText = decodeURIComponent(params.get('e'));
                if(params.get('p')) document.getElementById('val-password').innerText = decodeURIComponent(params.get('p'));
                if(params.get('b')) document.getElementById('val-birthday').innerText = decodeURIComponent(params.get('b'));
                if(params.get('q')) document.getElementById('val-q1').innerText = decodeURIComponent(params.get('q'));
            }
        };
        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                const toast = document.getElementById("toast"); toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2000);
            });
        }
    </script>
</body>
</html>
